name: Release

# **A release is a tag, and the artefacts are built from it.** Nothing here is built by hand: the
# version comes from the tag through `hatch_version.py`, so an artefact that says 1.2.0 was built
# from `v1.2.0` and nothing else can make it say that.
on:
  push:
    tags: ["v*"]
  # So a release can be re-cut without moving a tag — the artefacts rebuild from the same commit.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build
        required: true

permissions:
  contents: write

jobs:
  wheel:
    name: Wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Tags and full history, because the version is derived from them (#33). Actions
        # checks out a shallow clone with no tags by default, and hatch-vcs then falls back
        # to 0.0.0 rather than failing — so every artefact would report the same wrong
        # number, silently. tests/test_versioning.py fails if this line goes.
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: The version in the artefact is the version in the tag
        run: |
          set -eu
          tag="${{ inputs.tag || github.ref_name }}"
          expected="${tag#v}"
          ls dist/
          test -n "$(find dist -name "smartclock_monitor-${expected}*.whl")" \
            || { echo "::error::no wheel for ${expected}; hatch_version.py derived something else"; \
                 exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  appimage:
    name: AppImage
    runs-on: ubuntu-22.04
    # **The oldest runner, deliberately.** An AppImage carries everything but glibc, so the build
    # machine's glibc is the floor for every machine that runs it — building on the newest would
    # quietly raise that floor for every user.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 fuse
      - run: pip install -e ".[package]"
      - run: ./build/make-appimage.sh
      # **`|| true` on the only place this artefact is ever exercised is why #147 went unseen.**
      # The AppImage's `--doctor` failed Qt and fonts on every machine — `sys.executable` is the
      # launcher in a frozen build, so the probe re-invoked argparse — and nothing looked at the
      # verdict for as long as the AppImage has existed.
      #
      # A headless runner cannot expect `[ok]` here, so this asserts the narrower thing that is
      # true everywhere: the report is *printed*, and any Qt failure is attributed to Qt rather
      # than to somebody else's stderr. The bench is where `[ok]` gets checked.
      - name: It runs, and says what it is
        run: |
          set -eu
          ./dist/smartclock-monitor-*.AppImage --doctor > doctor.txt 2>&1 || true
          cat doctor.txt
          grep -q "smartclock-monitor doctor" doctor.txt \
            || { echo "::error::the AppImage printed no report at all"; exit 1; }
          for check in pyserial "Serial ports" "Qt platform"; do
            grep -q "$check" doctor.txt \
              || { echo "::error::the report stopped before '$check'"; exit 1; }
          done
          grep -q "saying nothing about Qt" doctor.txt \
            && { echo "::error::the GUI probe never reached Qt — see #147"; exit 1; }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: flatpak-builder, and the runtime it builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
      - name: The manifest builds the tag this release is for
        run: |
          set -eu
          tag="${{ inputs.tag || github.ref_name }}"
          grep -q "tag: $tag" packaging/flatpak/io.github.tgoodhew.SmartClockMonitor.yml \
            || { echo "::error::the manifest builds a different tag than $tag"; exit 1; }
      # **The version a software centre shows, which is the one surface nothing checked** (#146).
      # v1.2.1 shipped reporting 1.0.0 because the newest <release> in the metainfo is hand-typed
      # and the only test over it asserted that an entry existed, not that it matched anything. The
      # value was fixed by hand; this is the gap that let it drift.
      - name: The metainfo names the release this tag is for
        run: |
          set -eu
          tag="${{ inputs.tag || github.ref_name }}"
          expected="${tag#v}"
          newest="$(python3 tools/newest_release.py)"
          test "$newest" = "$expected" || {
            echo "::error::the metainfo's newest release is $newest, and this is $expected."
            echo "::error::Add a <release version=\"$expected\"> entry, newest first."
            exit 1
          }
      - name: Build the bundle
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=repo build-dir \
            packaging/flatpak/io.github.tgoodhew.SmartClockMonitor.yml
          flatpak build-bundle repo \
            "smartclock-monitor-${{ inputs.tag || github.ref_name }}-x86_64.flatpak" \
            io.github.tgoodhew.SmartClockMonitor
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: "*.flatpak"

  publish:
    name: Publish
    needs: [wheel, appimage, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Attach every artefact to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ inputs.tag || github.ref_name }}"
          find artefacts -type f -printf '%p\n'
          # **Create it if it is not there.** `gh release upload` answers "release not found" and
          # stops, which is what v1.2.0 did: the artefacts were built correctly and had nowhere to
          # go. A tag with no release is the ordinary case for a tag that was just pushed.
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" $(find artefacts -type f) --clobber
