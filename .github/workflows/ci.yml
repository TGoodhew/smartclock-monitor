name: CI

on:
  push:
    branches: [main]
  pull_request:

# The shape is borrowed from WinZ3805A: the cheap checks run in their own
# dependency-free jobs alongside the tests rather than behind them, so a lint,
# typing or palette regression fails in seconds instead of after an install.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Tags and full history, because the version is derived from them (#33). Actions
        # checks out a shallow clone with no tags by default, and hatch-vcs then falls back
        # to 0.0.0 rather than failing — so every artefact would report the same wrong
        # number, silently. tests/test_versioning.py fails if this line goes.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  palette:
    name: Colour derivation self-test
    runs-on: ubuntu-latest
    # build/palette/ came across from WinZ3805A already written in Python and
    # runs unchanged. validate.py checks the colour maths against the figures
    # published in the issue that prompted the derivation, before anything
    # trusts it. It reports rather than exits, so the failure marker is the gate.
    steps:
      - uses: actions/checkout@v7
        # Tags and full history, because the version is derived from them (#33). Actions
        # checks out a shallow clone with no tags by default, and hatch-vcs then falls back
        # to 0.0.0 rather than failing — so every artefact would report the same wrong
        # number, silently. tests/test_versioning.py fails if this line goes.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Reproduce the published figures
        run: |
          python build/palette/validate.py | tee /tmp/palette.txt
          if grep -q '!!' /tmp/palette.txt; then
            echo "::error::The colour maths no longer reproduces the published figures."
            exit 1
          fi

  closing-keywords:
    name: Closing keywords
    runs-on: ubuntu-latest
    # The half of #131 that cannot be checked from the tree. GitHub closes an issue
    # on merge wherever a closing keyword stands before an issue reference, in the
    # pull request body as well as in a commit message - and the body is not in the
    # repository, so tests/test_closing_keywords.py cannot see it. The body is read
    # from the event payload through the environment rather than interpolated into
    # the script, because a body is arbitrary text a contributor wrote.
    #
    # Same module as the test, so the two halves of the rule cannot drift apart.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        # This job needs no history of its own — the body it checks is not in the tree.
        # It carries the full checkout anyway, because tests/test_versioning.py holds every
        # checkout in this file to it: one blanket rule that cannot be misapplied beats an
        # exemption somebody has to be right about.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: A keyword closes something only where it means to
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: python tools/closing_keywords.py --text "$BODY"

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    # **Only when the packaging changes, or on a tag.** A flatpak-builder run installs a 1.5 GB
    # runtime and takes minutes, which is the wrong tax on a pull request that changed a docstring
    # — and the manifest builds the application from a **tag**, so a PR's own code is not what it
    # would be testing anyway. What it does test is the thing that actually breaks: a manifest that
    # has drifted from the wheels, the runtime or the identity files.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        # Tags and full history, because the version is derived from them (#33). Actions
        # checks out a shallow clone with no tags by default, and hatch-vcs then falls back
        # to 0.0.0 rather than failing — so every artefact would report the same wrong
        # number, silently. tests/test_versioning.py fails if this line goes.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The pinned wheels are the ones this repository tests against
        run: |
          pip install -e ".[dev]"
          python tools/flatpak_requirements.py --check
      - name: Only build when the manifest or its pins changed
        id: changed
        run: |
          git fetch --no-tags --depth=2 origin "${{ github.base_ref || github.ref_name }}" || true
          if [ "${{ github.event_name }}" != "pull_request" ] \
            || ! git diff --quiet HEAD^ -- packaging/ tools/flatpak_requirements.py; then
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        if: steps.changed.outputs.build == 'yes'
        with:
          bundle: smartclock-monitor.flatpak
          manifest-path: packaging/flatpak/io.github.tgoodhew.SmartClockMonitor.yml
          cache-key: flatpak-builder-${{ github.sha }}

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Tags and full history, because the version is derived from them (#33). Actions
        # checks out a shallow clone with no tags by default, and hatch-vcs then falls back
        # to 0.0.0 rather than failing — so every artefact would report the same wrong
        # number, silently. tests/test_versioning.py fails if this line goes.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    env:
      # Qt needs a platform plugin even for tests that never open a window.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        # Tags and full history, because the version is derived from them (#33). Actions
        # checks out a shallow clone with no tags by default, and hatch-vcs then falls back
        # to 0.0.0 rather than failing — so every artefact would report the same wrong
        # number, silently. tests/test_versioning.py fails if this line goes.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # PySide6 will not import without these, and the UI tests skip themselves when it cannot.
      # Installing them is what makes the difference between the widget tests running and the
      # suite quietly reporting green while never having drawn anything.
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - run: pip install -e ".[dev]"

      # **Asserted rather than skipped on the newest version.** `importorskip` in the widget tests
      # is right for a build machine missing libEGL — a packaging problem, not a defect — and is
      # *wrong* as a way of passing a Python whose PySide6 wheels do not exist yet. Without this a
      # 3.14 job would report green having drawn nothing, which reads as coverage.
      - name: Qt is importable, not merely optional
        run: python -c "import PySide6.QtWidgets; print(PySide6.__version__)"

      - run: pytest -v
