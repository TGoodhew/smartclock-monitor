<?xml version="1.0" encoding="UTF-8"?>
<!--
  The application's icon: §9.10.2's medallion, which is the main window's primary element and the
  thing a user recognises the application by. A ring of sixty ticks around a centre that carries
  the tracked-satellite count — here a stylised count rather than a number, because an icon is
  read at 16 px as often as at 256.

  Colours are §9.4.4's teal family, the same hues the sequential ramp is derived from. Drawn rather
  than rendered from the widget: the widget paints a live sparkline, and an icon must be the same
  every time it is drawn.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>SmartClock Monitor</title>

  <circle cx="64" cy="64" r="60" fill="#0B3B40"/>

  <!-- The ring: the medallion's defining shape (§9.3 reserves circles for it). -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#3FB8C4" stroke-width="10"/>

  <!-- Twelve of the sixty ticks, which is as many as survive at 16 px. -->
  <g stroke="#9BD3D9" stroke-width="4" stroke-linecap="round">
    <line x1="64" y1="8"   x2="64" y2="17"/>
    <line x1="92" y1="15"  x2="88"  y2="23"/>
    <line x1="113" y1="36" x2="105" y2="40"/>
    <line x1="120" y1="64" x2="111" y2="64"/>
    <line x1="113" y1="92" x2="105" y2="88"/>
    <line x1="92"  y1="113" x2="88" y2="105"/>
    <line x1="64" y1="120" x2="64" y2="111"/>
    <line x1="36" y1="113" x2="40" y2="105"/>
    <line x1="15" y1="92"  x2="23" y2="88"/>
    <line x1="8"  y1="64"  x2="17" y2="64"/>
    <line x1="15" y1="36"  x2="23" y2="40"/>
    <line x1="36" y1="15"  x2="40" y2="23"/>
  </g>

  <!-- The 1 PPS tick the whole instrument exists to discipline. -->
  <circle cx="64" cy="64" r="12" fill="#C5E6E9"/>
</svg>
